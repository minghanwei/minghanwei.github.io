<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 560" role="img" aria-labelledby="title desc">
<title id="title">Natural-language constrained path-planning pipeline</title>
<desc id="desc">Two-pathway LLM pipeline for constrained route planning from natural language. Known problems use a stored structured problem formulation, while unseen problems generate one. Both pathways verify constraints, correct violations, iteratively improve valid routes, and select the best route.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#3b6f99"/>
  </marker>
  <style>
    .box{fill:#eef1f4;stroke:#2f4054;stroke-width:2.2}
    .decision{fill:#ffffff;stroke:#2f4054;stroke-width:2.2}
    .line{fill:none;stroke:#3b6f99;stroke-width:3.2;marker-end:url(#arrow)}
    .loop{fill:none;stroke:#3b6f99;stroke-width:3.0;stroke-dasharray:9 8;marker-end:url(#arrow)}
    .label{font:600 18px Arial,Helvetica,sans-serif;fill:#222;text-anchor:middle}
    .small{font:600 15px Arial,Helvetica,sans-serif;fill:#222;text-anchor:middle}
    .note{font:16px Arial,Helvetica,sans-serif;fill:#444;text-anchor:middle}
    .pathnote{font:600 15px Arial,Helvetica,sans-serif;fill:#334;text-anchor:middle}
  </style>
</defs>

<!-- Input and SPF search -->
<rect class="box" x="25" y="245" width="145" height="72" rx="4"/>
<text class="label" x="97.5" y="272"><tspan x="97.5">Requirements</tspan><tspan x="97.5" dy="23">in plain text</tspan></text>

<rect class="box" x="220" y="225" width="210" height="112" rx="4"/>
<text class="label" x="325" y="257"><tspan x="325">LLM: structured</tspan><tspan x="325" dy="23">problem formulation</tspan><tspan x="325" dy="23">(SPF) search</tspan></text>
<path class="line" d="M170 281 H220"/>

<!-- Upper pathway: matched case -->
<text class="note" x="560" y="42">Matched with a case in the library</text>
<path class="line" d="M430 250 H470 V105 H535"/>

<rect class="box" x="535" y="68" width="220" height="78" rx="4"/>
<text class="label" x="645" y="97"><tspan x="645">LLM: solution generation</tspan><tspan x="645" dy="23">(SPF as prompts)</tspan></text>

<rect class="box" x="810" y="78" width="170" height="58" rx="4"/>
<text class="label" x="895" y="102"><tspan x="895">Constraint</tspan><tspan x="895" dy="22">verification</tspan></text>

<polygon class="decision" points="1110,76 1190,107 1110,138 1030,107"/>
<text class="label" x="1110" y="113">Violations?</text>

<path class="line" d="M755 107 H810"/>
<path class="line" d="M980 107 H1030"/>

<!-- Upper violation loop -->
<path class="loop" d="M1110 138 V174 H645 V146"/>
<text class="pathnote" x="877.5" y="161">Yes — revise using violated constraints</text>

<!-- Merge into iterative improvement -->
<rect class="box" x="1155" y="233" width="175" height="76" rx="4"/>
<text class="label" x="1242.5" y="262"><tspan x="1242.5">Iterative</tspan><tspan x="1242.5" dy="23">improvement</tspan></text>

<path class="line" d="M1190 107 H1242 V233"/>
<text class="small" x="1216" y="92">No</text>

<!-- Lower pathway: new formulation -->
<text class="note" x="650" y="370">New problem formulation needed</text>
<path class="line" d="M430 310 H470 V430 H535"/>

<rect class="box" x="535" y="395" width="165" height="70" rx="4"/>
<text class="label" x="617.5" y="423"><tspan x="617.5">LLM: SPF</tspan><tspan x="617.5" dy="23">generation</tspan></text>

<rect class="box" x="750" y="390" width="220" height="80" rx="4"/>
<text class="label" x="860" y="420"><tspan x="860">LLM: solution generation</tspan><tspan x="860" dy="23">(SPF as prompts)</tspan></text>

<rect class="box" x="1020" y="390" width="190" height="80" rx="4"/>
<text class="label" x="1115" y="420"><tspan x="1115">LLM: prompts for</tspan><tspan x="1115" dy="23">self-verification</tspan></text>

<polygon class="decision" points="1335,392 1410,430 1335,468 1260,430"/>
<text class="label" x="1335" y="436">Violations?</text>

<path class="line" d="M700 430 H750"/>
<path class="line" d="M970 430 H1020"/>
<path class="line" d="M1210 430 H1260"/>

<!-- Lower violation loop -->
<path class="loop" d="M1335 468 V518 H860 V470"/>
<text class="pathnote" x="1097.5" y="545">Yes — self-generated correction prompts</text>

<!-- Lower no-violation path to iterative improvement -->
<path class="line" d="M1410 430 H1450 V345 H1242 V309"/>
<text class="small" x="1430" y="414">No</text>

<!-- Final output -->
<rect class="box" x="1360" y="238" width="72" height="66" rx="4"/>
<text class="small" x="1396" y="264"><tspan x="1396">Best</tspan><tspan x="1396" dy="20">route</tspan></text>
<path class="line" d="M1330 271 H1360"/>
</svg>
